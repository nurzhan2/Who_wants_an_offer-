[project]
name = "who-wants-an-offer"
version = "0.1.0"
description = "Resume-driven job aggregator: CV -> profile -> sources -> match score -> dashboard"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "tenacity>=9.0",
    "structlog>=24.4",
    "pgvector>=0.3.6",
    "python-multipart>=0.0.20",
    "anthropic>=0.42",
    "uuid-utils>=0.17.0",
]

[project.optional-dependencies]
# Kept empty on purpose: runtime extras (embeddings, telegram) arrive with the
# phases that need them, so the base image stays small.

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "faker>=33.1",
    "ruff>=0.8.4",
    "mypy>=1.14",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

# ── ruff ──────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app", "factories", "helpers"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.format]
docstring-code-format = true

# ── mypy ──────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
files = ["backend/app"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "backend"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

# ── pytest ────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=app",
    "--cov-report=term-missing",
]
# An xfail that starts passing is a failure: the bug it documented is gone
# and the marker is now lying. Combined with the CI skip guard in
# conftest.py this makes xfail unusable as a place to park a known bug.
xfail_strict = true
markers = [
    "db: test requires a live PostgreSQL database with the pgvector extension",
]
filterwarnings = ["error", "ignore::DeprecationWarning:pytest_asyncio.*"]

[tool.coverage.run]
source = ["backend/app"]
branch = true
omit = ["backend/app/__init__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
