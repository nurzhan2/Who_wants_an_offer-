[project]
name = "who-wants-an-offer"
version = "0.1.0"
description = "Resume-driven job aggregator: CV -> profile -> sources -> match score -> dashboard"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "tenacity>=9.0",
    "structlog>=24.4",
    "pgvector>=0.3.6",
    "python-multipart>=0.0.20",
    "anthropic>=0.42",
    "uuid-utils>=0.17.0",
    "pdfplumber>=0.11.10",
    "python-docx>=1.2.0",
    "filetype>=1.2.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# Local embedding inference. Kept out of the default install on purpose: it
# pulls torch, transformers, scipy and scikit-learn — roughly 1.5 GB on disk,
# before the 2.3 GB of bge-m3 weights downloaded on first use. CI does not
# install it; `make verify-embeddings` exercises it deliberately.
#
# fastembed was evaluated as a lighter runtime (onnxruntime, no torch, ~128 MB)
# and rejected: it ships no bge-m3 in any of its embedding classes, so adopting
# it would mean changing the embedding model, not just the runtime.
embeddings = ["sentence-transformers>=6.0"]

[dependency-groups]
# The local apply agent. A group rather than a project dependency, and the
# distinction is load-bearing: backend/Dockerfile builds with
# `uv sync --frozen --no-dev`, which installs [project].dependencies and no
# groups at all, so playwright can never reach the server image. The brief's
# rule — «backend не должен зависеть от playwright» — is therefore a property of
# how this is declared rather than a note in a README.
#   uv sync --group agent && uv run playwright install chromium
agent = [
    "playwright>=1.62",
    "httpx>=0.28",
    "structlog>=24.4",
]

dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "faker>=33.1",
    "ruff>=0.8.4",
    "mypy>=1.14",
    "pre-commit>=4.0",
    # Generates the resume fixtures, including the two-column PDF that is the
    # whole point of the extractor tests.
    "reportlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

# ── ruff ──────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app", "factories", "helpers"]

[tool.ruff.lint.per-file-ignores]
# RUF001 guards against homoglyph attacks — a Cyrillic "с" hiding in code that
# reads as ASCII. In a file whose whole point is a realistic Russian job post,
# every other letter trips it and the signal is zero. Scoped to the files that
# genuinely carry Russian sample text rather than disabled globally.
"scripts/bench_ollama.py" = ["RUF001"]
"scripts/run_pipeline.py" = ["RUF001", "RUF002"]
"scripts/backfill_skills.py" = ["RUF001", "RUF002"]
"scripts/run_matching.py" = ["RUF001", "RUF002"]
# The Stage 0 catalogue probe prints its whole report in Russian, next to hh's
# own latin slugs and URLs, so every second word mixes scripts and trips this.
"scripts/probe_hh_roles.py" = ["RUF001", "RUF002"]
# A transliteration table IS a homoglyph table: every one of its 33 keys is a
# Cyrillic letter that ruff correctly points out looks like a Latin one. The
# protection RUF001 gives is restored as a test instead — see
# ``test_the_transliteration_table_is_cyrillic_in_and_ascii_out``, which also
# holds the Latin-only tables beside it to being Latin, which is the failure
# that would otherwise be silent.
"backend/app/sources/hh_roles.py" = ["RUF001", "RUF002"]
"backend/tests/test_hh_roles.py" = ["RUF001", "RUF002"]
# The development seed carries the Russian a person reads on the dashboard —
# hh's warning lines, the agent's reasons, a cover letter — and those sentences
# name technologies in Latin, which is what makes every other letter of them
# "ambiguous". Same reasoning as the scripts above.
"scripts/seed.py" = ["RUF001", "RUF002"]
# Every finding this module reports is written for the person reading it, in
# Russian, and the docstring quotes a real mangled extraction. RUF001/RUF002
# fire on almost every word here and would bury a genuine homoglyph.
"backend/app/resume/ats_audit.py" = ["RUF001", "RUF002", "RUF003"]
# The same, for the module that reads a document against a vacancy's
# requirement list: its docstring quotes the Russian spellings a keyword filter
# fails on, which is the fact the whole module exists for.
"backend/app/resume/ats_keywords.py" = ["RUF001", "RUF002", "RUF003"]
# The module that reads requirements out of a description is made of Russian:
# the phrases an employer marks a nice-to-have with, the denials that drop a
# mention, and the Cyrillic spellings of technologies. Every one of them mixes
# scripts by nature — «C++» inside a Russian sentence is the case the rules
# exist for — so RUF001-003 fire on the data rather than on a mistake.
"backend/app/normalize/description.py" = ["RUF001", "RUF002", "RUF003"]
"backend/tests/test_normalize_description.py" = ["RUF001", "RUF002", "RUF003"]
"backend/tests/test_ats_keywords.py" = ["RUF001", "RUF002"]
"backend/tests/test_ats_service.py" = ["RUF001", "RUF002"]
# Its new cases assert on a Russian resume text layer read against a Russian
# posting, which is the comparison the endpoint exists to make.
"backend/tests/test_profile_api.py" = ["RUF001", "RUF002"]
# Its assertions are about Russian resume text and the Russian findings raised
# on it, so the same reasoning applies as for the module under test.
"backend/tests/test_ats_audit.py" = ["RUF001", "RUF002"]
# Everything these four modules put in front of a person is Russian: the
# reasons a document was withheld, the hard rules as the owner reads them, and
# the section headings a generated CV is required to carry — the headings are a
# contract with app/resume/ats_audit.py, which searches for those exact words.
# RUF001/RUF002 fire on almost every line of them and would bury a real finding,
# the same trade already made for ats_audit.py itself.
"backend/app/documents/guard.py" = ["RUF001", "RUF002"]
"backend/app/documents/rules.py" = ["RUF001", "RUF002"]
"backend/app/documents/render.py" = ["RUF001", "RUF002"]
"backend/app/documents/service.py" = ["RUF001", "RUF002"]
# Its assertions are about Russian CV text, the Russian findings raised on it,
# and the Cyrillic-alphabet word boundaries the guard's mention check turns on.
"backend/tests/test_documents.py" = ["RUF001", "RUF002"]
"backend/tests/test_documents_api.py" = ["RUF001", "RUF002"]
# The source tests assert on Russian fixture data and Russian API messages.
"backend/tests/test_source_quota.py" = ["RUF001", "RUF002"]
"backend/tests/test_sources_api.py" = ["RUF001", "RUF002"]
"backend/tests/test_sources_connectors.py" = ["RUF001", "RUF002"]
"backend/tests/test_query_planner.py" = ["RUF001", "RUF002"]
"backend/tests/test_sources_base.py" = ["RUF001", "RUF002"]
"backend/tests/test_sources_http.py" = ["RUF001", "RUF002"]
"backend/tests/test_sources_registry.py" = ["RUF001", "RUF002"]
"backend/tests/test_pipeline_runner.py" = ["RUF001", "RUF002"]
"backend/tests/test_normalize_requirements.py" = ["RUF001", "RUF002"]
"backend/tests/test_matching_rules.py" = ["RUF001", "RUF002"]
"backend/tests/test_matching_scorer.py" = ["RUF001", "RUF002"]
"backend/tests/test_script_reports.py" = ["RUF001", "RUF002"]
"backend/tests/test_pipeline_end_to_end.py" = ["RUF001", "RUF002"]
# Its fixtures are notes a person typed into a tracker, in Russian, next to a
# block the agent rendered in Russian — telling those two apart is the whole
# subject of the file.
"backend/tests/test_migration_0008_notes.py" = ["RUF001", "RUF002"]
# The dashboard tests assert on the Russian a person reads on it — hh's warning
# line, a city name, a resume that mentions Rust — beside the Latin names of the
# technologies those sentences are about.
"backend/tests/test_dashboard.py" = ["RUF001", "RUF002"]
# Its docstring argues about company forms and city names in the two languages
# this market writes them in, so the examples are necessarily Cyrillic.
"backend/app/normalize/fingerprint.py" = ["RUF001", "RUF002"]
"backend/app/matching/rules.py" = ["RUF001", "RUF002"]
"backend/app/matching/scorer.py" = ["RUF001", "RUF002"]
# Source failures reach the dashboard, so their messages are Russian.
"backend/app/sources/base.py" = ["RUF001", "RUF002"]
"backend/app/sources/http.py" = ["RUF001", "RUF002"]
"backend/app/sources/registry.py" = ["RUF001", "RUF002"]
"backend/app/sources/jsearch.py" = ["RUF001", "RUF002"]
# Its docstrings quote hh's own field dictionary, which is Russian, and its
# failure messages are the ones the dashboard shows.
"backend/app/sources/hh.py" = ["RUF001", "RUF002"]
"backend/tests/test_sources_hh.py" = ["RUF001", "RUF002"]
"backend/tests/test_hh_canary.py" = ["RUF001", "RUF002"]
"backend/app/sources/query_planner.py" = ["RUF001", "RUF002"]
"backend/app/sources/remotive.py" = ["RUF001", "RUF002"]
"backend/app/sources/arbeitnow.py" = ["RUF001", "RUF002"]
"backend/app/pipeline/runner.py" = ["RUF001", "RUF002"]
# The contact block is read out of Russian resumes and written back by a
# Russian-speaking owner, so the fixtures, the sample text and the rejected
# values are all Cyrillic — including the deliberately invalid ones, whose
# whole point is to be text rather than a slug or a number.
"backend/tests/test_resume_contacts.py" = ["RUF001", "RUF002"]
"backend/tests/test_contacts_api.py" = ["RUF001", "RUF002"]
# Its fixtures are invented people with Russian names, addresses and cities:
# every identity string in the file is Cyrillic by construction.
"backend/tests/test_pii_logging.py" = ["RUF001", "RUF002"]
# The workshop is where the owner writes rules about their own documents, so
# every module in it argues about Russian section headings ("навыки"), quotes
# the owner's own example of a rule, and matches the dash characters a Russian
# document is bulleted with. RUF001-002 fire on almost every one of those lines
# and would bury a genuine homoglyph.
"backend/app/workshop/*.py" = ["RUF001", "RUF002", "RUF003"]
"backend/tests/test_workshop.py" = ["RUF001", "RUF002", "RUF003"]
"backend/tests/test_workshop_api.py" = ["RUF001", "RUF002", "RUF003"]
# The dashboard's operation buttons, the browser confirmation and the notices
# say what happened in Russian to the person who pressed the button, and quote
# hh's own Russian sentences about the resume.
"backend/app/services/operations.py" = ["RUF001", "RUF002"]
"backend/app/services/confirmations.py" = ["RUF001", "RUF002"]
"backend/app/services/notices.py" = ["RUF001", "RUF002"]
"backend/app/matching/profile_vectors.py" = ["RUF001", "RUF002"]
"backend/tests/test_operations.py" = ["RUF001", "RUF002"]
"backend/tests/test_confirmations.py" = ["RUF001", "RUF002"]
"backend/tests/test_notices.py" = ["RUF001", "RUF002"]

# Every message this agent prints is read by the person whose account it is
# about to act on, so all of them are Russian, and RUF001-003 fire on almost
# every line. Scoped to the package rather than disabled globally.
"agent/*.py" = ["RUF001", "RUF002", "RUF003"]
"agent/tests/*.py" = ["RUF001", "RUF002", "RUF003"]
# The CLI prints the same Russian to the same console, and its docstrings
# argue about the Kazakh letters that do not fit in that console's codepage.
"wwao/*.py" = ["RUF001", "RUF002", "RUF003"]
"wwao/tests/*.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.format]
docstring-code-format = true

# ── mypy ──────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
files = ["backend/app", "agent", "wwao"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "backend"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

# ── pytest ────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests", "agent/tests", "wwao/tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=app",
    # The agent's tests run in this session (see testpaths), so its code has to
    # be inside the same gate. It was not: --cov=app with source=["backend/app"]
    # produced a coverage.xml with zero agent files, and CI's --cov-fail-under
    # therefore said nothing at all about the package this repository added last.
    "--cov=agent",
    # And the CLI, for the same reason: its tests run in this session, so its
    # code has to be inside the same coverage gate.
    "--cov=wwao",
    "--cov-report=term-missing",
    # Deselected, not skipped. conftest.py makes a skip fatal in CI so that a
    # green build means everything ran, and a test that deliberately talks to a
    # live third party can never be part of that promise — it fails when the
    # network is down, which says nothing about this code. `-m network` on the
    # command line overrides this and is how the canary is actually run.
    "-m",
    "not network",
]
# An xfail that starts passing is a failure: the bug it documented is gone
# and the marker is now lying. Combined with the CI skip guard in
# conftest.py this makes xfail unusable as a place to park a known bug.
xfail_strict = true
markers = [
    "db: test requires a live PostgreSQL database with the pgvector extension",
    "slow: test loads a real model or otherwise takes seconds, not milliseconds",
    "unit: pure test, no database, no model, no network",
    "network: real request to a third party; deselected by default, run as a canary",
]
filterwarnings = ["error", "ignore::DeprecationWarning:pytest_asyncio.*"]

[tool.coverage.run]
source = ["backend/app", "agent", "wwao"]
branch = true
omit = ["backend/app/__init__.py", "agent/__init__.py", "wwao/__init__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
