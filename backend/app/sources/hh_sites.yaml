# Which hh sites this deployment crawls, and how a planned area finds one.
#
# A file rather than class constants for the reason CLAUDE.md gives: the city is
# not a property of the code. A deployment that moves to Astana edits this and
# nothing else; a deployment that adds hh.ru adds an entry here. `default: true`
# marks the sites used when the plan names no place this file recognises, which
# is what happens for a remote-only or relocation-only profile.
#
# `aliases` are matched case-insensitively against SearchQuery.area, which is
# free text the candidate typed into their resume, so every spelling that
# actually turns up belongs here.
sites:
  - host: almaty.hh.kz
    city: Алматы
    country: KZ
    default: true
    aliases: [алматы, алма-ата, almaty, alma-ata, алматы қаласы]
  - host: astana.hh.kz
    city: Астана
    country: KZ
    aliases: [астана, astana, нур-султан, nur-sultan, целиноград]
  - host: shymkent.hh.kz
    city: Шымкент
    country: KZ
    aliases: [шымкент, shymkent, чимкент]
  - host: karaganda.hh.kz
    city: Караганда
    country: KZ
    aliases: [караганда, karaganda, қарағанды]

# How long one run goes, and which of the cities above it walks.
#
# Every value here is absent by default, and absent means exactly what the
# connector did before this block existed: a run bounded by MAX_PAGES_PER_RUN
# alone, walking the city the resume names — or the `default: true` ones when
# it names none — and stopping for good at the first check for robots.
#
# The pace is NOT here and is not configurable. 0.25 requests a second is
# measured, not chosen: at 0.73 hh stopped a live crawl at the 172nd vacancy
# and at 1.02 at the 50th, while 0.25 walked 961 vacancies in 88 minutes and
# was never asked anything. Going faster collects LESS, because the run dies
# and the recorded position does not move. The way to collect more is to go
# for longer, which is what `minutes` is for.
crawl:
  # Wall-clock ceiling for one run, in minutes. Absent: no ceiling, and
  # `pages` alone stops the run. A night run sets this — the owner knows the
  # machine is theirs until morning and does not know how many pages that is.
  #   minutes: 480
  minutes:

  # Vacancy pages one run may fetch, across every city. Absent means
  # MAX_PAGES_PER_RUN (1200), which is about 90 minutes at the declared pace.
  # Raise it with `minutes` or it becomes the limit that actually bites: eight
  # hours can reach about 7200 pages, and a run left at 1200 stops at ninety
  # minutes while the report says the night went fine. The connector logs
  # `sources.hh.page_budget_binds` when these two disagree.
  #   pages: 7500
  pages:

  # Wait out a check for robots once per run, in minutes, then come back to hh
  # at half the pace. Absent: the challenge ends the run, which is what has
  # always happened. Read `_pause_for_challenge` in hh.py before turning this
  # on — it argues the case and draws the line. The captcha is never answered,
  # nothing about the crawler changes, and a second challenge ends the run.
  # Needs `minutes` set: the wait is refused unless twice its length remains.
  #   pause_minutes: 45
  pause_minutes:

  # Which cities a run walks, in order, and each one's share of the budget.
  # Empty: the city the resume names, or the `default: true` ones.
  #
  # An explicit list REPLACES the resume's area — that is the point of writing
  # one. Almaty's corpus is some 14 000 pages, so a run that follows the resume
  # never opens Astana however many nights it is left running. A plan naming a
  # city this list leaves out is logged as `sources.hh.area_outside_rotation`.
  #
  # Shares are weights, not percentages: 6/2/1/1 gives Almaty six tenths of the
  # pages and six tenths of the night, and adding a fifth city does not mean
  # editing the other four. The order is the order they are walked, so the
  # first one is the one a short run spends itself on.
  #   cities:
  #     - {host: almaty.hh.kz, share: 6}
  #     - {host: astana.hh.kz, share: 2}
  #     - {host: shymkent.hh.kz, share: 1}
  #     - {host: karaganda.hh.kz, share: 1}
  cities: []

# The long run, for a machine left until morning. Read instead of `crawl:`
# when HH_CRAWL_PROFILE=night, which is what `wwao crawl` is told to set at
# night and what nothing else sets: the dashboard's buttons and the chain run
# in a server process that never sees it, so they keep the `crawl:` budget
# above and behave exactly as they did before this block existed.
#
# Why a second block rather than raising the numbers above: those numbers are
# also what the "Собрать вакансии" button uses. Eight hours there means the
# daytime press runs until evening, and the owner finds out by waiting.
#
# The pace is NOT part of this. Measured against live hh: 1.02 requests a
# second met a check for robots at the 50th vacancy, 0.73 at the 172nd, and
# 0.25 walked 961 in 88 minutes untouched. Going faster collects less, because
# the run dies and the position does not move. The night is about length.
#
# `minutes` and `pages` both have to be set. Raising only the time leaves the
# 1200-page default as the limit that actually bites: the run stops at ninety
# minutes while the report says the night went fine.
night:
  # Eight hours. About 5200 vacancies at the measured 655 pages an hour —
  # roughly 40% of what Almaty has left, so the city takes two or three nights.
  minutes: 480
  # Headroom over what eight hours can reach, so time is the thing that stops
  # the run and the page count never silently becomes the ceiling.
  pages: 7500
  # Wait out one check for robots and come back at half the pace, once per run.
  # Without it a check at the second hour costs the remaining six.
  pause_minutes: 45
  # Empty: the cities the resume names. Add hosts here once Almaty is covered —
  #   cities:
  #     - {host: almaty.hh.kz, weight: 3}
  #     - {host: astana.hh.kz, weight: 1}
  cities: []
