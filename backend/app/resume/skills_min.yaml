# Minimal skill dictionary: canonical name -> group + the spellings that mean it.
#
# Loaded by app.resume.skills. Deliberately small and flat — the full
# dictionary with a relatedness graph lands in phase 4 and replaces this file,
# not its callers.
#
# Rules for editing:
#   * the key is the canonical name, always lower case;
#   * `aliases` holds spellings that are NOT reachable by normalisation
#     (casefold, then drop whitespace, ".", "-", "_"). "Node.JS" already folds
#     onto `nodejs`, so listing it buys nothing - but "React.js" folds onto
#     `reactjs`, which the `react` entry has to spell out;
#   * no spelling may be claimed by two different skills — the loader refuses
#     the file, because such a dictionary would canonicalise by file order;
#   * a canonical name must appear once - YAML keeps only the last of two
#     identical keys and the earlier entry's aliases vanish without a word;
#   * Cyrillic aliases are the ones that actually turn up on hh.ru, not
#     transliterations invented at the desk.

